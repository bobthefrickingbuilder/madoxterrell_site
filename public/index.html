<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madox Terrell | Composer, vocalist and producer</title>
<meta name="description" content="Madox Terrell is an Ottawa composer, vocalist and producer. Choral and electronic music, and sheet music as PDF downloads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Martian+Mono:wght@600;800&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: var(--surface); color: var(--ink); font-family: var(--font-sans); }
  main { box-sizing: border-box; width: 100%; max-width: 1240px; margin: 0 auto; padding: var(--space-8); }
  .eyebrow { margin: 0 0 var(--space-4); text-transform: uppercase; color: var(--ink-muted); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 12vw, 120px); line-height: 0.95; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  p.lead { margin: var(--space-8) 0 0; max-width: 520px; font-size: 20px; line-height: 32px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Composer / Vocalist / Producer</p>
  <h1>Madox<br><span>Terrell</span></h1>
  <p class="lead">Choral and electronic music, written, sung and produced in Ottawa. New site coming soon.</p>
</main>
</body>
</html>
